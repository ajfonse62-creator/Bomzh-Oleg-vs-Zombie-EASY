<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ULTRA-ZOMBIE: ОТРЯД ИЗ 10 БОЙЦОВ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font:bold 15px monospace;overflow:hidden;user-select:none}
#c{display:block;width:100vw;height:calc(100vh - 42px);image-rendering:pixelated}
#mm{position:absolute;top:8px;right:8px;width:110px;height:75px;border:2px solid #fff;background:#000}
#sb{position:absolute;top:90px;right:8px;text-align:right;background:rgba(0,0,0,.7);border-right:3px solid #fa0;padding:3px 7px}
#rk{font-size:18px;color:#fa0}
#lg{font-size:10px;color:#0f0}
#ms{position:absolute;top:8px;left:8px;background:rgba(20,0,0,.85);padding:6px 10px;border:2px solid #f00;font-size:12px;max-width:calc(100vw - 130px)}
#cr{position:absolute;top:calc(50% - 21px);left:50%;transform:translate(-50%,-50%);color:#0f0;font-size:20px;pointer-events:none}
#hd{height:42px;background:#1a1a1a;border-top:2px solid #555;display:flex;justify-content:space-around;align-items:center}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:9;padding:15px}
button{padding:10px 18px;font-size:16px;margin:6px;font-family:inherit;font-weight:bold;background:#c00;color:#fff;border:2px solid #fff;cursor:pointer}
button:hover{background:#f00}
.sk{display:flex;gap:14px;margin:14px 0}
.sb{border:3px solid #555;background:#222;padding:10px;width:130px;cursor:pointer}
.sb.act{border-color:#0f0;background:#132}
.sb img{width:60px;height:60px;object-fit:contain;background:#fff;display:block;margin:0 auto 6px}
</style>
</head>
<body>
<div id="ov">
  <h1 style="color:#f00">ULTRA-ZOMBIE: ТЫ + 9 ДРУЗЕЙ-БОТОВ</h1>
  <p style="color:#aaa;font-size:13px;margin-top:6px">Выбери свой скин — 9 союзников разбегутся по городу и начнут охоту на зомби!</p>
  <div class="sk">
    <button type="button" id="s1" class="sb act" onclick="pick(1)"><img src="skin1.png" onerror="this.style.opacity=.2">СКИН 1</button>
    <button type="button" id="s2" class="sb" onclick="pick(2)"><img src="skin2.png" onerror="this.style.opacity=.2">СКИН 2</button>
  </div>
  <button type="button" onclick="startPlay()" style="background:#090;font-size:22px;padding:14px 36px">НАЧАТЬ ИГРУ</button>
</div>
<canvas id="c" width="320" height="200"></canvas>
<canvas id="mm" width="60" height="40"></canvas>
<div id="ms"></div>
<div id="cr">+</div>
<div id="sb"><div id="rk">D</div><div id="lg"></div></div>
<div id="hd">
  <div style="color:#f33">HP:<span id="hp">100</span></div>
  <div style="color:#0f0">ОТРЯД:<span id="pl">10</span>/10</div>
  <div>ВРАГИ:<span id="en">0</span></div>
  <div>ЭТАП:<span id="st">1</span>/30</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const mx2=document.getElementById('mm').getContext('2d');
const ov=document.getElementById('ov'),sp=new Map(),k=new Map();
let mySkin='skin1',ac=null;

function pick(n){
  mySkin='skin'+n;
  document.getElementById('s1').className='sb'+(n==1?' act':'');
  document.getElementById('s2').className='sb'+(n==2?' act':'');
}
function sfx(a,b,d,t='sawtooth'){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state=='suspended')ac.resume();
    if(ac.state!='running')return;
    const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=t;o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(b,n+d);
    g.gain.setValueAtTime(.13,n);g.gain.exponentialRampToValueAtTime(.01,n+d);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);
  }catch(e){}
}
function clean(im){
  const f=document.createElement('canvas'),w=im.width||64,h=im.height||64;
  f.width=w;f.height=h;const g=f.getContext('2d');g.drawImage(im,0,0);
  try{
    const id=g.getImageData(0,0,w,h),d=id.data,vis=new Uint8Array(w*h),q=new Array();
    for(let i=0;i<w;i++){q.push(i);q.push((h-1)*w+i);}
    for(let j=0;j<h;j++){q.push(j*w);q.push(j*w+w-1);}
    while(q.length){
      const idx=q.pop();
      if(vis.subarray(idx,idx+1).join('')=='1')continue;
      vis.fill(1,idx,idx+1);const p4=idx*4;
      if(d.subarray(p4,p4+1).join('')>230&&d.subarray(p4+1,p4+2).join('')>230&&d.subarray(p4+2,p4+3).join('')>230){
        d.fill(0,p4+3,p4+4);const xx=idx%w,yy=(idx/w)|0;
        if(xx>0)q.push(idx-1);if(xx<w-1)q.push(idx+1);
        if(yy>0)q.push(idx-w);if(yy<h-1)q.push(idx+w);
      }
    }
    g.putImageData(id,0,0);
  }catch(e){}
  return f;
}
function fb(n){
  const f=document.createElement('canvas');f.width=f.height=32;const g=f.getContext('2d');
  g.fillStyle=n=='zombie'?'#4a2':n=='solider'?'#092':n=='skin1'?'#f80':n=='skin2'?'#ea5':n=='трассер'?'#fa0':'#444';
  g.fillRect(8,4,16,24);return f;
}
new Array('zombie','solider','skin1','skin2','gun','трассер').forEach(n=>{
  sp.set(n,fb(n));const m=new Image();m.onload=()=>sp.set(n,clean(m));m.src=n+'.png';
});
const W=60,H=40;
function cell(xx,yy){
  if(yy<=0||yy>=H-1||xx<=0||xx>=W-1)return 1;
  if(xx%8>=2&&xx%8<=6&&yy%8>=2&&yy%8<=6){
    if((xx+yy)%9==0)return 2;
    const m=(Math.floor(xx/8)+Math.floor(yy/8))%3;
    return m==0?1:m==1?4:5;
  }
  return 0;
}
const roads=new Array();
for(let y=2;y<H-2;y++)for(let xx=2;xx<W-2;xx++)if(!cell(xx,y))roads.push({x:xx+.5,y:y+.5});
let p={x:15.5,y:15.5,d:0,hp:100,sh:0,z:0,vz:0},st=1,ens=new Array(),bs=new Array(),bots=new Array();
let rc=0,run=0,hc=0,hf=0,pts=0,lg='',ending=0;
</script>
<script>
function addS(v,t){
  pts=Math.min(700,pts+v);
  lg=t+'<br>'+lg.split('<br>').shift();
  document.getElementById('lg').innerHTML=lg;
}
function pickRoad(){
  return roads.slice(Math.floor(Math.random()*roads.length)).shift()||{x:20,y:20};
}
function spawnBots(){
  bots=new Array();
  for(let i=0;i<9;i++){
    const r=pickRoad(),w=pickRoad();
    bots.push({x:r.x,y:r.y,wx:w.x,wy:w.y,hp:130,sk:i%2==0?'skin1':'skin2',cd:10+i*4});
  }
}
function spw(n,hp,t,cd=0){
  const v=roads.filter(r=>Math.hypot(r.x-p.x,r.y-p.y)>6);
  for(let i=0;i<n&&v.length;i++){
    const idx=Math.floor(Math.random()*v.length),s=v.splice(idx,1).pop();
    ens.push({x:s.x,y:s.y,hp,max:hp,t,cd,boss:0});
  }
}
function set(s){
  st=s;document.getElementById('st').innerText=st;ens=new Array();bs=new Array();
  if(s>1){sfx(440,880,.35,'square');spawnBots();}
  if(s<30){
    document.getElementById('ms').innerText='ЭТАП '+s+'/30 — 9 друзей-ботов охотятся на зомби по всему городу!';
    ens.push({x:22.5,y:15.5,hp:60+s*3,max:60+s*3,t:'zombie',cd:0,boss:0});
    spw(Math.min(35,6+s),60+s*3,'zombie');
  }else{
    document.getElementById('ms').innerText='ФИНАЛЬНЫЙ БОССФАЙТ (ЭТАП 30/30): ВЕСЬ ОТРЯД ШТУРМУЕТ ГИГАНТСКОГО SOLIDER!';
    ens.push({x:24.5,y:15.5,hp:3200,max:3200,t:'solider',cd:25,boss:1});
    spw(8,95,'zombie');
  }
}
function startPlay(){
  if(run)return;
  ov.style.display='none';run=1;
  spawnBots();set(1);loop();
}
function updateBots(){
  let aliveBots=0;
  bots.forEach((b,idx)=>{
    if(b.hp<=0)return;
    aliveBots++;
    let target=null,bestD=999;
    ens.forEach(e=>{
      if(e.hp>0){
        const ed=Math.hypot(e.x-b.x,e.y-b.y);
        if(ed<bestD){bestD=ed;target=e;}
      }
    });
    let gx=b.wx,gy=b.wy,stopD=1.0;
    if(target){gx=target.x;gy=target.y;stopD=target.boss?5.0:3.5;}
    const dist=Math.hypot(gx-b.x,gy-b.y);
    if(dist>stopD){
      const vx=(gx-b.x)/dist*.085,vy=(gy-b.y)/dist*.085;
      let moved=0;
      if(!cell((b.x+vx)|0,b.y|0)){b.x+=vx;moved=1;}
      if(!cell(b.x|0,(b.y+vy)|0)){b.y+=vy;moved=1;}
      if(!moved||Math.random()<.01){const nw=pickRoad();b.wx=nw.x;b.wy=nw.y;}
    }else if(!target){
      const nw=pickRoad();b.wx=nw.x;b.wy=nw.y;
    }
    if(target&&bestD<15&&--b.cd<=0){
      b.cd=20+(idx%5)*4;
      const a=Math.atan2(target.y-b.y,target.x-b.x)+(Math.random()-.5)*.07;
      bs.push({x:b.x,y:b.y,vx:Math.cos(a)*.22,vy:Math.sin(a)*.22,fp:1,bot:1});
    }
  });
  document.getElementById('pl').innerText=1+aliveBots;
}
</script>
<script>
function getRank(){
  return new Array('D','C','B','A','S','SS','SSS','ULTRAKILL').slice(Math.min(7,Math.floor(pts/85))).shift();
}
function showEnd(win){
  if(ending)return;
  ending=1;run=0;document.exitPointerLock();
  if(!win){
    sfx(110,40,.5,'square');
    ov.innerHTML='<h1 style="color:#f00">ВЫ ПОГИБЛИ НА ЭТАПЕ '+st+'</h1><p style="margin:12px 0">Ранг стиля: '+getRank()+'</p><button onclick="location.reload()">ЗАНОВО</button>';
    ov.style.display='flex';
    return;
  }
  sfx(440,660,.2,'square');setTimeout(()=>sfx(554,880,.2,'square'),200);setTimeout(()=>sfx(659,1100,.4,'square'),400);
  ov.style.background='rgba(0,15,5,.88)';
  ov.innerHTML='<canvas id="fw" width="320" height="110" style="border:2px solid #0f0;background:#051020;margin-bottom:10px"></canvas>'
    +'<h1 style="color:#0f0;font-size:24px">ФИНАЛ: ГОРОД ПОЛНОСТЬЮ СПАСЁН!</h1>'
    +'<p style="max-width:520px;margin:10px auto;line-height:1.4;color:#eee">Все 30 волн заражённых прорваны! Гигантский командир мутантов <b>SOLIDER</b> уничтожен, а в небе над городом зажглись сигнальные огни победы. Вы и ваши 9 друзей-бойцов полностью очистили город!</p>'
    +'<p style="color:#fa0;font-size:18px;margin-bottom:12px">ИТОГОВЫЙ РАНГ СТИЛЯ: '+getRank()+'</p>'
    +'<button onclick="location.reload()" style="background:#090">ИГРАТЬ СНОВА</button>';
  ov.style.display='flex';
  const fc=document.getElementById('fw').getContext('2d'),sparks=new Array();
  setInterval(()=>{
    fc.fillStyle='rgba(5,16,32,.25)';fc.fillRect(0,0,320,110);
    if(Math.random()<.12){
      const cx=40+Math.random()*240,cy=20+Math.random()*50,col=Math.random()<.5?'#0f0':'#fa0';
      for(let i=0;i<18;i++){const a=i*6.28/18;sparks.push({x:cx,y:cy,vx:Math.cos(a)*2,vy:Math.sin(a)*2,l:35,col});}
    }
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks.slice(i,i+1).shift();s.x+=s.vx;s.y+=s.vy;s.vy+=.04;s.l--;
      fc.fillStyle=s.col;fc.fillRect(s.x,s.y,3,3);
      if(s.l<=0)sparks.splice(i,1);
    }
  },30);
}
function fire(){
  if(!run||rc>0)return;
  rc=7;sfx(580,80,.1);
  bs.push({x:p.x+Math.cos(p.d)*.5,y:p.y+Math.sin(p.d)*.5,vx:Math.cos(p.d)*.22,vy:Math.sin(p.d)*.22,fp:1,air:p.z>5,dsh:p.sh>0});
}
onkeydown=e=>{
  k.set(e.code,1);if(e.code=='KeyF')fire();
  if(e.code=='Space'&&!p.z&&run){e.preventDefault();p.vz=5.5;sfx(150,380,.12,'sine');}
  if(e.code.includes('Shift')&&p.sh<=0&&run){p.sh=11;sfx(200,650,.14,'triangle');}
};
onkeyup=e=>k.set(e.code,0);
c.onmousedown=()=>{if(document.pointerLockElement!==c)try{c.requestPointerLock();}catch(e){}fire();};
onmousemove=e=>{if(document.pointerLockElement===c)p.d+=e.movementX*.0035;};

function loop(){
  if(!run)return;
  if(p.sh>0)p.sh--;if(rc>0)rc--;if(hc>0)hc--;if(hf>0)hf--;pts=Math.max(0,pts-.15);
  if(p.z>0||p.vz){p.z+=p.vz;p.vz-=.45;if(p.z<=0)p.z=p.vz=0;}
  let sp0=p.sh>0?.22:.085;
  if(k.get('KeyQ')||k.get('ArrowLeft'))p.d-=.045;
  if(k.get('KeyE')||k.get('ArrowRight'))p.d+=.045;
  let mx=0,my=0;
  if(k.get('KeyW')||k.get('ArrowUp')){mx+=Math.cos(p.d)*sp0;my+=Math.sin(p.d)*sp0;}
  if(k.get('KeyS')||k.get('ArrowDown')){mx-=Math.cos(p.d)*sp0;my-=Math.sin(p.d)*sp0;}
  if(k.get('KeyA')){mx+=Math.sin(p.d)*sp0;my-=Math.cos(p.d)*sp0;}
  if(k.get('KeyD')){mx-=Math.sin(p.d)*sp0;my+=Math.cos(p.d)*sp0;}
  if(!cell((p.x+mx)|0,p.y|0))p.x+=mx;
  if(!cell(p.x|0,(p.y+my)|0))p.y+=my;

  updateBots();

  let cnt=0;
  ens.forEach(e=>{
    if(e.hp<=0)return;
    cnt++;
    let tx=p.x,ty=p.y,d=Math.hypot(p.x-e.x,p.y-e.y);
    bots.forEach(b=>{if(b.hp>0){const bd=Math.hypot(b.x-e.x,b.y-e.y);if(bd<d){tx=b.x;ty=b.y;d=bd;}}});
    if(d<25){
      let sd=e.boss?4.5:1.5,spd=e.boss?.048:.038;
      if(d>sd){
        let vx=(tx-e.x)/d*spd,vy=(ty-e.y)/d*spd;
        if(!cell((e.x+vx)|0,e.y|0))e.x+=vx;
        if(!cell(e.x|0,(e.y+vy)|0))e.y+=vy;
      }
      if(e.boss&&--e.cd<=0&&d<16){
        e.cd=26;let a=Math.atan2(ty-e.y,tx-e.x);
        bs.push({x:e.x,y:e.y,vx:Math.cos(a)*.18,vy:Math.sin(a)*.18,fp:0});
      }
    }
    if(Math.hypot(p.x-e.x,p.y-e.y)<(e.boss?2.2:1.7)&&p.z<12){
      p.hp-=e.boss?.8:.45;hf=6;if(hc<=0){sfx(110,45,.18);hc=25;}
    }
    bots.forEach(b=>{
      if(b.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<(e.boss?2.2:1.5))b.hp-=e.boss?.5:.25;
    });
  });

  bs.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(cell(b.x|0,b.y|0)){b.dead=1;return;}
    if(b.fp){
      ens.forEach(e=>{
        let rad=e.boss?1.4:.75;
        if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<rad){
          b.dead=1;
          if(!b.bot)sfx(180,40,.08,'square');
          e.hp-=b.bot?18:35;
          if(e.hp<=0&&!b.bot){
            addS(b.air?120:b.dsh?100:60,b.air?'+AIRSHOT':b.dsh?'+DASH KILL':'+KILL');
            if(Math.hypot(p.x-e.x,p.y-e.y)<3.5){p.hp=Math.min(100,p.hp+15);addS(50,'+BLOOD HEAL');}
          }
        }
      });
    }else{
      if(Math.hypot(p.x-b.x,p.y-b.y)<.65&&p.sh<=0&&p.z<10){p.hp-=22;b.dead=1;hf=8;sfx(110,45,.18);}
      bots.forEach(bt=>{if(bt.hp>0&&Math.hypot(bt.x-b.x,bt.y-b.y)<.65){bt.hp-=18;b.dead=1;}});
    }
  });
  bs=bs.filter(b=>!b.dead);

  document.getElementById('hp').innerText=Math.max(0,p.hp|0);
  document.getElementById('en').innerText=cnt;
  document.getElementById('rk').innerText=getRank();
  if(p.hp<=0){showEnd(0);return;}
  if(!cnt){
    if(st<30){p.hp=Math.min(100,p.hp+25);set(st+1);}
    else{showEnd(1);return;}
  }

  const hz=100+p.z;
  x.fillStyle='#3b1c1c';x.fillRect(0,0,320,hz);
  x.fillStyle='#484850';x.fillRect(0,hz,320,200-hz);
  const zb=new Array();
  for(let i=0;i<80;i++){
    let ra=p.d-.52+(i/80)*1.04,d=0,h=0;
    while(!h&&d<26){d+=.07;h=cell((p.x+Math.cos(ra)*d)|0,(p.y+Math.sin(ra)*d)|0);}
    d*=Math.cos(ra-p.d);zb.push(d);
    let wh=Math.min(280,200/d),sh=Math.max(50,250-d*8),yt=hz-wh/2+(p.z/d);
    x.fillStyle=h==1?`rgb(${sh*.85},${sh*.25},${sh*.2})`:h==2?`rgb(${sh*.8},${sh*.35},${sh*.3})`:h==4?`rgb(${sh*.9},${sh*.8},${sh*.2})`:`rgb(${sh*.55},${sh*.55},${sh*.6})`;
    if(h==2){x.fillRect(i*4,yt,4,wh*.3);x.fillRect(i*4,yt+wh*.7,4,wh*.3);}
    else x.fillRect(i*4,yt,4,wh);
  }
  let objs=new Array();
  ens.forEach(e=>{if(e.hp>0)objs.push({x:e.x,y:e.y,t:e.t,boss:e.boss,hp:e.hp,max:e.max,d:Math.hypot(e.x-p.x,e.y-p.y)});});
  bots.forEach(b=>{if(b.hp>0)objs.push({x:b.x,y:b.y,t:b.sk,d:Math.hypot(b.x-p.x,b.y-p.y)});});
  bs.forEach(b=>objs.push({x:b.x,y:b.y,t:'трассер',d:Math.hypot(b.x-p.x,b.y-p.y)}));
  objs.sort((a,b)=>b.d-a.d);

  objs.forEach(o=>{
    let ang=Math.atan2(o.y-p.y,o.x-p.x)-p.d;
    while(ang<-Math.PI)ang+=Math.PI*2;
    while(ang>Math.PI)ang-=Math.PI*2;
    if(Math.abs(ang)<.85&&o.d>.1){
      let sx=(ang/1.04+.5)*320,col=Math.floor(sx/4);
      if(col>=0&&col<80&&zb.slice(col,col+1).shift()>o.d){
        let mult=o.boss?1.7:o.t=='трассер'?.55:1,sz=Math.min(260,(175/o.d)*mult),yc=hz+(p.z/o.d);
        const img=sp.get(o.t)||sp.get('zombie');
        if(img)x.drawImage(img,sx-sz/2,yc-sz/2,sz,sz);
        if(o.boss){
          x.fillStyle='#000';x.fillRect(sx-35,yc-sz/2-12,70,7);
          x.fillStyle='#0f0';x.fillRect(sx-35,yc-sz/2-12,70*(o.hp/o.max),7);
        }
      }
    }
  });
  if(sp.get('gun'))x.drawImage(sp.get('gun'),130,118+rc*2.5,85,85);
  if(hf>0){x.fillStyle=`rgba(255,0,0,${hf*.05})`;x.fillRect(0,0,320,200);}
  mx2.fillStyle='#111';mx2.fillRect(0,0,W,H);
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++)if(cell(xx,yy)){mx2.fillStyle='#555';mx2.fillRect(xx,yy,1,1);}
  ens.forEach(e=>{if(e.hp>0){mx2.fillStyle=e.boss?'#f0f':'#f00';mx2.fillRect(e.x|0,e.y|0,e.boss?3:1.5,e.boss?3:1.5);}});
  bots.forEach(b=>{if(b.hp>0){mx2.fillStyle='#0af';mx2.fillRect(b.x|0,b.y|0,2,2);}});
  mx2.fillStyle='#0f0';mx2.fillRect(p.x|0,p.y|0,2,2);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
